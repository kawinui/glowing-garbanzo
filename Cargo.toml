[package]
name = "zsat"
version = "0.1.0"
edition = "2021"
description = "Zero-allocation hardened SAT solver: bounded CDCL + SLS + lookahead + adaptive RL controller"

[lib]
path = "src/lib.rs"

[[bin]]
name = "zsat"
path = "src/main.rs"

[features]
# Turns every unchecked hot-loop index into a bounds-checked one (for fuzzing / audits).
checked = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.test]
opt-level = 2
debug-assertions = true
